plugins {
    id 'com.android.application'
}

android {
    namespace 'com.youyouboydragon.soundblocker'
    compileSdk 36

    defaultConfig {
        applicationId 'com.youyouboydragon.soundblocker'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
